<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SudipStore Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;background:#f3f5f7;margin:0;color:#172235}.bar{background:#101827;color:#fff;padding:20px}.wrap{max-width:1100px;margin:25px auto;padding:0 15px}.panel{background:#fff;padding:22px;border-radius:15px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}button{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.yes{background:#10a82a;color:#fff}.no{background:#df3445;color:#fff}.pending{color:#c27b00}.denied{color:#d22}</style></head>
<body><div class="bar"><b>SudipStore — Secure Admin Panel</b><span id="who" style="float:right"></span></div><main class="wrap"><div class="panel"><h2>Pending Payments</h2><div id="content">Checking authorization...</div></div></main>
<script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="index.html";return}who.textContent=user.email;const {data:p}=await sb.from("profiles").select("role").eq("id",user.id).single();if(!p||p.role!=="admin"){content.innerHTML='<p class="denied">Access denied. Your account is not an administrator.</p>';return}load()}
async function load(){const {data,error}=await sb.from("orders").select("id,product_name,amount,payment_reference,status,created_at,profiles(full_name,email)").eq("status","pending").order("created_at",{ascending:false});if(error){content.innerHTML='<p class="denied">'+esc(error.message)+'</p>';return}if(!data.length){content.innerHTML="<p>No pending orders.</p>";return}content.innerHTML="<table><tr><th>Customer</th><th>Email</th><th>Product</th><th>Amount</th><th>Payment Ref</th><th>Time</th><th>Action</th></tr>"+data.map(o=>`<tr><td>${esc(o.profiles?.full_name)}</td><td>${esc(o.profiles?.email)}</td><td>${esc(o.product_name)}</td><td>NPR ${esc(o.amount)}</td><td>${esc(o.payment_reference)}</td><td>${new Date(o.created_at).toLocaleString()}</td><td><button class="yes" onclick="review(${o.id},'approved')">Approve</button> <button class="no" onclick="review(${o.id},'declined')">Decline</button></td></tr>`).join("")+"</table>"}
async function review(id,status){const {error}=await sb.from("orders").update({status,reviewed_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else load()}
boot();
</script></body></html>
