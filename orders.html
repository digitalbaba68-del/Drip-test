<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders - SudipStore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f5f7;margin:0}.bar{background:#101827;color:#fff;padding:20px}.wrap{max-width:800px;margin:25px auto;background:#fff;padding:20px;border-radius:14px}.order{padding:15px;border-bottom:1px solid #eee}.pending{color:#bd7800}.approved{color:#098b22}.declined{color:#d22}</style></head><body><div class="bar"><b>SudipStore — My Orders</b></div><main class="wrap"><h2>Your Orders</h2><div id="list">Loading...</div></main><script src="config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="index.html";return}const {data,error}=await sb.from("orders").select("product_name,amount,status,created_at").order("created_at",{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data.map(o=>`<div class="order"><b>${o.product_name}</b><br>NPR ${o.amount}<br><span class="${o.status}">${o.status.toUpperCase()}</span><br><small>${new Date(o.created_at).toLocaleString()}</small></div>`).join("")||"No orders yet."}load()</script></body></html>
